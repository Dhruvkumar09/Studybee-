name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_build:
        description: 'Run clean before build'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main, master, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Configure Gradle Execution
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK (${{ inputs.build_type || 'debug' }})
        working-directory: ./android
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          CLEAN: ${{ inputs.clean_build || false }}
        run: |
          CMD="./gradlew"
          if [ ! -f "$CMD" ]; then
            CMD="gradle"
          fi

          if [ "$CLEAN" = "true" ]; then
            $CMD clean
          fi

          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Building Release APK..."
            $CMD assembleRelease --stacktrace --no-daemon || $CMD assembleDebug --stacktrace --no-daemon
          else
            echo "Building Debug APK..."
            $CMD assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate Generated APK
        id: locate-apk
        working-directory: ./android
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            echo "apk_path=android/$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_filename=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -h $APK_PATH | cut -f1)" >> $GITHUB_OUTPUT
          else
            echo "Warning: APK file not found in default output directory."
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.locate-apk.outputs.apk_path != ''
        with:
          name: studylive-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 14

      - name: Generate Build Summary
        if: always()
        run: |
          echo "### 📱 StudyLive Android APK Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`${{ inputs.build_type || 'debug' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | \`Android 34 (API 34)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | \`Android 26 (Android 8.0+)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File** | \`${{ steps.locate-apk.outputs.apk_filename || 'app-debug.apk' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Size** | \`${{ steps.locate-apk.outputs.apk_size || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ *Download the APK artifact directly from the Summary page.*" >> $GITHUB_STEP_SUMMARY
